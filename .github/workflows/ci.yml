name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-tests:
    name: Contract lint + deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest genvm-linter
      # Real GenVM-specific structural validation (method signatures,
      # schema extraction, contract-class conventions) — distinct from
      # the pytest suite below, which only covers pure deterministic
      # logic. Both are required for a change to be considered verified.
      - run: genvm-lint check contracts/verdict_contract.py --json
      - run: python3 -m pytest tests/contract/test_verdict_parsing.py -v

  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholder values only — no real deploy target is contacted during
      # a build/lint/typecheck run. Never set real secrets here.
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
      NEXT_PUBLIC_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
      NEXT_PUBLIC_VERDICT_CONTRACT_ADDRESS: "0x0000000000000000000000000000000000000000"
      NEXT_PUBLIC_REOWN_PROJECT_ID: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
