services:
  postgres:
    image: postgres:16-alpine
    container_name: verdict_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdict_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-verdict}
    ports:
      # Host port defaults to 55433, not 5432 — this dev machine already has
      # a native Homebrew Postgres on localhost:5432 (connections there
      # silently landed on that instance instead of this container) and a
      # separate project's Docker Postgres already on 55432. Override
      # POSTGRES_PORT in .env if 55433 also conflicts locally.
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - verdict_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdict_app} -d ${POSTGRES_DB:-verdict}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verdict_pgdata:
    driver: local
