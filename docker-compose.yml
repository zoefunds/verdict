services:
  postgres:
    image: postgres:16-alpine
    container_name: verdict_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verdict_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-verdict}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - verdict_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verdict_app} -d ${POSTGRES_DB:-verdict}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verdict_pgdata:
    driver: local
